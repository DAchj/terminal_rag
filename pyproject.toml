[project]
name = "application"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "numpy>=2.4.6",
    "ollama>=0.6.2",
]

[project.scripts]
application = "application.application:main"

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"
